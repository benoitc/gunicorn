name: Docker Integration Tests

on:
  push:
    branches: [master]
    paths:
      - 'gunicorn/uwsgi/**'
      - 'tests/docker/uwsgi/**'
      - 'gunicorn/http2/**'
      - 'gunicorn/asgi/**'
      - 'gunicorn/workers/**'
      - 'tests/docker/h2spec/**'
      - '.github/workflows/docker-integration.yml'
  pull_request:
    paths:
      - 'gunicorn/uwsgi/**'
      - 'tests/docker/uwsgi/**'
      - 'gunicorn/http2/**'
      - 'gunicorn/asgi/**'
      - 'gunicorn/workers/**'
      - 'tests/docker/h2spec/**'
      - '.github/workflows/docker-integration.yml'

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  uwsgi-nginx:
    name: uWSGI Protocol with nginx
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov requests

      - name: Run uWSGI integration tests
        run: |
          pytest tests/docker/uwsgi/ -v --tb=short

  h2spec:
    name: HTTP/2 conformance (h2spec)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
      - name: Run h2spec against each HTTP/2 worker
        run: |
          pytest tests/docker/h2spec/ -v --tb=short
